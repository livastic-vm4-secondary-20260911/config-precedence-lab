name: VM4 auto-timeout long workflow

on:
  pull_request:

jobs:
  long_probe:
    name: VM4 auto-timeout long
    runs-on: ubuntu-latest
    steps:
      - name: Controlled pending window
        run: |
          if [[ "$GITHUB_HEAD_REF" == mergify/merge-queue/* ]]; then
            sleep 180
          else
            sleep 1
          fi
