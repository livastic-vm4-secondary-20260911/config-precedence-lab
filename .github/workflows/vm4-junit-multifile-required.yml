name: VM4 aggregate JUnit required

on:
  pull_request:

permissions:
  contents: read

jobs:
  aggregate-gate:
    name: VM4 aggregate required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install current stable Mergify CLI
        run: python -m pip install --disable-pip-version-check mergify-cli==2026.9.10.1

      - name: Produce one failed-but-empty shard with its exit masked
        run: |
          mkdir -p reports
          python - <<'PY' || true
          from pathlib import Path
          Path("reports/01-failed-empty.xml").write_text('''<?xml version="1.0" encoding="UTF-8"?>
          <testsuites tests="1" failures="1" errors="0" skipped="0">
            <testsuite name="failed-shard" tests="1" failures="1" errors="0" skipped="0"></testsuite>
          </testsuites>
          ''')
          raise SystemExit(17)
          PY

      - name: Produce one passing shard
        run: |
          python - <<'PY'
          from pathlib import Path
          Path("reports/02-pass.xml").write_text('''<?xml version="1.0" encoding="UTF-8"?>
          <testsuites tests="1" failures="0" errors="0" skipped="0">
            <testsuite name="passing-shard" tests="1" failures="0" errors="0" skipped="0">
              <testcase classname="vm4.aggregate" name="passes" time="0.01" />
            </testsuite>
          </testsuites>
          ''')
          PY

      - name: Mergify aggregate gate
        run: |
          mergify ci junit-process \
            --color never \
            --api-url http://127.0.0.1:1 \
            --token mck_vm4_dummy_multifile_gate \
            --repository vm4-mergify-org-a91c37/config-precedence-lab \
            --tests-target-branch main \
            'reports/*.xml'
