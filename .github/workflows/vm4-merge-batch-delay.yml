name: VM4 merge-batch delay

on:
  pull_request:

permissions:
  contents: read

jobs:
  delayed:
    name: VM4 merge-batch delay
    runs-on: ubuntu-latest
    steps:
      - name: Hold merge-batch freshness window
        run: sleep 40
      - name: Succeed
        run: echo VM4_MERGEBATCH_DELAY_SUCCESS
