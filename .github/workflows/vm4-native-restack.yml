name: VM4 native restack guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    name: VM4 native restack guard
    runs-on: ubuntu-latest
    steps:
      - name: Reject child only after GitHub restacks it to main
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          printf 'title=%s base=%s\n' "$PR_TITLE" "$BASE_REF"
          if [[ "$PR_TITLE" == VM4-NATIVE-STACK-CHILD* && "$BASE_REF" == "main" ]]; then
            echo 'VM4_NATIVE_RESTACK_GUARD_FAIL'
            exit 17
          fi
          echo 'VM4_NATIVE_RESTACK_GUARD_PASS'
