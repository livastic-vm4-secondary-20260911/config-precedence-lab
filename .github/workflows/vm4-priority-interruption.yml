name: VM4 priority interruption

on:
  pull_request:

permissions:
  contents: read

jobs:
  base-guard:
    name: VM4 priority base guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject resumed normal PR after urgent base change
        run: |
          echo '--- guard state ---'
          ls -la
          if [[ -f vm4-priority-normal.txt ]] && grep -q '^BLOCK$' vm4-priority-gate.txt 2>/dev/null; then
            echo VM4_PRIORITY_BASE_GUARD_FAIL_STALE_REUSE_WOULD_BE_BAD
            exit 17
          fi
          echo VM4_PRIORITY_BASE_GUARD_PASS

  long:
    name: VM4 priority long
    runs-on: ubuntu-latest
    steps:
      - name: Keep interruption window open
        run: sleep 45
      - run: echo VM4_PRIORITY_LONG_PASS
