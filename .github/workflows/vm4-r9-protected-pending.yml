name: VM4 R9 protected pending source
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    name: VM4 R9 protected pending source
    runs-on: ubuntu-latest
    steps:
      - if: startsWith(github.head_ref, 'mergify/merge-queue/')
        run: sleep 35
      - if: github.event.action == 'synchronize' && github.head_ref == 'vm4-r9-protected-a'
        run: |
          echo 'new source head remains pending, then fails'
          sleep 120
          exit 1
      - run: echo green
