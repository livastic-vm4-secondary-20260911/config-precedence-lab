name: VM4 rename scope provenance probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scope-detect:
    runs-on: ubuntu-latest
    outputs:
      scopes: ${{ steps.mergify-scopes.outputs.scopes }}
    steps:
      - uses: actions/checkout@v4
      - id: mergify-scopes
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes
  critical-test:
    needs: scope-detect
    if: ${{ fromJSON(needs.scope-detect.outputs.scopes).critical == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "This controlled critical test must fail whenever critical scope is affected"
          exit 1
