name: VM4 standard pending post-success head R8
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    name: VM4 standard pending post-success head R8
    runs-on: ubuntu-latest
    steps:
      - if: startsWith(github.head_ref, 'mergify/merge-queue/')
        run: sleep 35
      - if: github.event.action == 'synchronize' && github.head_ref == 'vm4-standard-pending-r8-a'
        run: |
          echo 'new source head stays pending, then fails'
          sleep 120
          exit 1
      - run: echo green
