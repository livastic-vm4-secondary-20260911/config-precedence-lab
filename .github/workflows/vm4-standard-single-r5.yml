name: VM4 single fork post-success head R5
on:
  pull_request:
permissions:
  contents: read
jobs:
  delay:
    if: github.event.action != 'synchronize' || github.head_ref != 'vm4-standard-single-r5-b'
    name: VM4 single fork post-success head R5
    runs-on: ubuntu-latest
    steps:
      - if: startsWith(github.head_ref, 'mergify/merge-queue/')
        run: sleep 50
      - run: echo old-green
