name: VM4 legacy status classification probe
on:
  push:
    branches: [main]
permissions:
  contents: read
  statuses: write
jobs:
  create-statuses:
    runs-on: ubuntu-latest
    steps:
      - name: Create controlled commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: 4aa4e29f7d4c2ffae79b470ad8c64795de45e352
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']; sha=os.environ['TARGET_SHA']
          for state in ('error','failure'):
              body=json.dumps({'state':state,'context':f'vm4-status-{state}','description':f'VM4 controlled {state} status'}).encode()
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',data=body,method='POST',headers={
                  'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'vm4-status-classification-probe'})
              with urllib.request.urlopen(req,timeout=15) as r:
                  d=json.load(r); print(state,d['id'],d['state'],d['context'])
          PY
