merge_queue:
  mode: serial

queue_rules:
  - name: vm4-multicommand-safe
    queue_conditions:
      - label = vm4-never-queue-multicommand
    merge_conditions:
      - check-success = vm4-never-merge-multicommand
    checks_timeout: null

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
