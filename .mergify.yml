merge_protections_settings:
  reporting_method: check-runs
  post_comment: false
merge_protections:
  - name: vm4 fork same-sha easy policy
    if:
      - base = vm4-mp-fork-easy-base
    success_conditions:
      - -draft
  - name: vm4 fork same-sha strict main policy
    if:
      - base = main
    success_conditions:
      - label = VM4_FORK_STRICT_LABEL_NEVER_PRESENT
