merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: default
    queue_conditions: []
    merge_conditions:
      - check-success = VM4 priority base guard
      - check-success = VM4 priority long
    checks_timeout: null

priority_rules:
  - name: urgent
    conditions:
      - title = VM4-PRIORITY-URGENT-20260916
    priority: high
    allow_checks_interruption: true
  - name: normal
    conditions: []
    priority: low
