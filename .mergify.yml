merge_queue:
  mode: parallel
  max_parallel_checks: 1

queue_rules:
  - name: vm4-self-command-safe-queue
    queue_conditions:
      - label = vm4-never-queue-self-command-guard
    merge_conditions:
      - check-success = vm4-never-merge-self-command-guard
    checks_timeout: null

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write

pull_request_rules:
  - name: vm4 comment template command provenance probe
    conditions:
      - author = livastic-vm4-secondary-20260911
      - label = vm4-self-command-trigger
    actions:
      comment:
        message: "{{title}}"
      label:
        remove:
          - vm4-self-command-trigger
