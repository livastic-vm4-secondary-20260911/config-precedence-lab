merge_queue:
  max_parallel_checks: 3
queue_rules:
  - name: default
    queue_conditions: []
    merge_conditions:
      - check-success = VM4 auto timeout poison R11
      - title ~= ^VM4_TIMEOUT_POISON_ACTIVE_
    merge_method: merge
    batch_size: 1
    checks_timeout: auto
merge_protections_settings:
  auto_merge_conditions:
    - title ~= ^VM4_TIMEOUT_POISON_ACTIVE_
pull_request_rules: []
