merge_queue:
  max_parallel_checks: 1
queue_rules:
  - name: default
    queue_conditions: []
    merge_conditions:
      - check-success = VM4 post-success review revocation delay
      - '#approved-reviews-by >= 1'
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 2 min
    checks_timeout: null
pull_request_rules: []
