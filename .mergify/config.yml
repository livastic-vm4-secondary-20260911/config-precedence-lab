merge_queue:
  max_parallel_checks: 1
queue_rules:
  - name: default
    queue_conditions: []
    merge_conditions:
      - check-success = VM4 standard merge post-success head freshness R3
    merge_method: merge
    batch_size: 2
    batch_max_wait_time: 2 min
    checks_timeout: null
pull_request_rules: []
